# 프론트 파트(frontend/) CI. 루트 .gitlab-ci.yml 에서 아래처럼 포함해 사용한다.
#
#   include:
#     - local: frontend/.gitlab-ci.yml
#
# 루트는 소유권 경계상 프론트 담당이 수정하지 않으므로(ADR-0002) 포함 설정은 팀에서 처리한다.
# 포함 전까지 이 파일은 동작하지 않는다.

frontend:check:
  # package.json engines 는 node >=20.19.0 이지만 eslint 10 이 ^20.19 || ^22.13 || >=24 를
  # 요구한다. 로컬 개발도 24 로 돌고 있어 24 로 맞춘다.
  image: node:24
  variables:
    # npm ci 는 node_modules 를 지우고 다시 만들므로 node_modules 대신 npm 캐시를 재사용한다.
    npm_config_cache: '$CI_PROJECT_DIR/.npm'
  # frontend/ 변경에만 반응해 다른 파트 파이프라인에 영향을 주지 않는다.
  rules:
    - changes:
        - frontend/**/*
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm
  before_script:
    - cd frontend
    # lock 을 그대로 쓰기 위해 install 이 아니라 ci 다.
    - npm ci
  # 검사 목록은 scripts/check.sh 한 곳에만 둔다. 로컬과 CI 가 갈라지지 않게.
  script:
    - ./scripts/check.sh
