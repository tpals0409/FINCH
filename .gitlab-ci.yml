# 루트 CI 설정 — 파트별 CI 를 include 만 한다.
#
# 파트별 CI 는 각 파트 디렉터리의 .gitlab-ci.yml 에 두고 그 파트가 소유한다 (ADR-0002).
# 각 파트 job 은 rules: changes 로 자기 파트 변경에만 반응하므로 서로의 파이프라인에
# 영향을 주지 않는다. backend/frontend 파트도 CI 를 만들면 아래에 한 줄씩 추가한다.
#
# 실행 주체는 VM 에 등록된 gitlab-runner(docker executor)다. 배포는 CI 가 아니라
# Jenkins(루트 Jenkinsfile)가 master 머지 webhook 으로 수행한다 — 역할 분담은
# infra/README.md 참고.
include:
  - local: ai/.gitlab-ci.yml
  - local: backend/.gitlab-ci.yml
