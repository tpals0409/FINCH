# frontend 이미지에 들어가는 nginx 설정 (infra/docker/frontend.Dockerfile).
#
# TLS 는 여기서 끊지 않는다. 예전에는 443 블록이
# /etc/letsencrypt/live/j15a101.p.ssafy.io/ 를 가리켰는데, 그 파일은 호스트 마운트로만
# 들어왔다. k8s 에는 그 마운트가 없어 nginx 가 기동 자체에 실패했다 — 이미지가 배포 불가였다.
# k8s 에서는 Ingress 가 TLS 를 끊는다 (finch-gitops apps/prod/frontend/values.yaml).
#
# 웹소켓 업그레이드용: 클라이언트가 Upgrade 헤더를 보냈을 때만 Connection: upgrade 를 전달하고,
# 일반 요청은 빈 값(헤더 미전달)으로 두어 keep-alive 를 깨지 않는다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 빌드 산출물은 파일명에 해시가 붙으므로 길게 캐시해도 안전하다.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 폴백 (react-router)
    location / {
        try_files $uri /index.html;
    }

    # upstream 주소를 변수로 두고 Docker 내장 DNS(127.0.0.11)로 요청 시점에 해석한다.
    # 고정 주소로 쓰면 해당 컨테이너가 없을 때 nginx 자체가 기동에 실패한다.
    resolver 127.0.0.11 valid=10s;

    # Spring Boot — /api 프리픽스를 그대로 전달한다.
    #
    # **이 블록은 로컬 compose 전용이다.** compose 는 호스트에 nginx 80 하나만 열고
    # backend 를 내부 네트워크에만 두므로, 브라우저가 같은 오리진의 /api 로 부르려면
    # 여기서 넘겨야 한다. k8s 에서는 Ingress 가 /api 를 backend 로 직접 보내고
    # (backend values.yaml 의 ingress.path 가 / 보다 긴 프리픽스라 먼저 매칭된다)
    # 이 블록에는 요청이 닿지 않는다. compose 를 버리는 날 같이 지운다.
    #
    # 웹소켓(STOMP, apiSpec §5.6) 대비: Upgrade/Connection 은 hop-by-hop 헤더라
    # 프록시가 명시적으로 넘겨야 핸드셰이크가 성립한다. $http_upgrade 가 비면
    # $connection_upgrade 도 빈 값이 되어 일반 HTTP 요청에는 영향이 없다 (map 참고).
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # FastAPI(ai)는 외부로 노출하지 않는다. 계약상 AI 는 백엔드가 중계하고
    # (apiSpec §10, FE 도 /api 만 호출 — frontend/src/shared/config/apiContract.ts),
    # 직접 노출 시 신뢰 헤더(X-User-Id) 위조 경로가 열린다.
}
